services:
  - type: web
    name: medical-report-ocr
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # Generated by Render so the token never lands in the repo or a shell history.
      # Read it from the service's Environment tab to hand to a client.
      - key: API_BEARER_TOKEN
        generateValue: true
      # Entered in the dashboard on first deploy.
      - key: DATALAB_API_KEY
        sync: false
      # Free instances sleep after 15 minutes idle, so a cold request already pays a
      # startup penalty. Keep the OCR poll short enough that the two together stay
      # inside the proxy's patience.
      - key: DATALAB_MODE
        value: fast
      - key: DATALAB_POLL_TIMEOUT_MS
        value: "90000"
      - key: OCR_PROVIDER
        value: datalab
      - key: LOG_LEVEL
        value: info
